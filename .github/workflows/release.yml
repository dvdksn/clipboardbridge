name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create the GitHub Release and upload assets
  id-token: write       # required by attest-build-provenance for OIDC signing
  attestations: write   # write the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile binaries
        run: make build-all VERSION=${{ github.ref_name }}

      - name: Generate checksums
        run: make checksums

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/clipboard-bridge-linux-amd64
            dist/clipboard-bridge-linux-arm64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/clipboard-bridge-linux-amd64
            dist/clipboard-bridge-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
