name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create the GitHub Release and upload assets
  id-token: write       # required by attest-build-provenance for OIDC signing
  attestations: write   # write the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile binaries
        run: make build-all VERSION=${{ github.ref_name }}

      - name: Generate checksums
        run: make checksums

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/clipboard-bridge-linux-amd64
            dist/clipboard-bridge-linux-arm64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/clipboard-bridge-linux-amd64
            dist/clipboard-bridge-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
